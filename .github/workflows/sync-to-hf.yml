name: Sync to Hugging Face

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Create or update Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf repos create nimrajaffar/enterprise-rag-assistant \
            --repo-type space \
            --space-sdk docker \
            --exist-ok \
            --token "$HF_TOKEN"

      - name: Upload project to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload nimrajaffar/enterprise-rag-assistant . \
            --repo-type space \
            --token "$HF_TOKEN"
